<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#243b55" />
  <title>Today Tomorrow Weather</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="weather-cloudy is-day">
  <main class="app-shell" aria-live="polite">
    <div class="controls" aria-label="地域と更新操作">
      <label class="sr-only" for="locationSelect">地域を選択</label>
      <select id="locationSelect" aria-label="地域を選択">
        <option value="35.561,139.716" data-name="東京都 大田区" selected>東京都 大田区</option>
        <option value="35.6619,139.7024" data-name="東京都 渋谷区">東京都 渋谷区</option>
        <option value="35.4437,139.6380" data-name="神奈川県 横浜市">神奈川県 横浜市</option>
        <option value="36.5551,139.8826" data-name="栃木県 宇都宮市">栃木県 宇都宮市</option>
      </select>
      <button id="btnGps" class="icon-btn" type="button" aria-label="現在地を取得" title="現在地を取得">📍</button>
      <button id="btnRefresh" class="icon-btn" type="button" aria-label="天気を更新" title="更新">🔄</button>
    </div>

    <section class="card" id="mainCard" aria-labelledby="title">
      <div class="topline">
        <h1 id="title">今日の天気</h1>
        <div class="meta" id="updated">更新: --</div>
      </div>

      <div class="tabs" role="tablist" aria-label="予報期間">
        <button id="tabToday" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="forecastPanel" data-index="0">今日</button>
        <button id="tabTomorrow" class="tab" type="button" role="tab" aria-selected="false" aria-controls="forecastPanel" data-index="1">明日</button>
        <button id="tabWeekly" class="tab" type="button" role="tab" aria-selected="false" aria-controls="forecastPanel" data-index="2">週間</button>
      </div>

      <div id="forecastPanel" role="tabpanel" tabindex="0">
        <div class="now" id="nowBlock">
          <div>
            <div id="desc" class="meta">—</div>
            <div id="hiLo" class="hiLo">最高 —°C / 最低 —°C</div>
            <details class="location-details">
              <summary>地点情報</summary>
              <div class="meta" id="coordsDisplay">--</div>
            </details>
          </div>
          <div class="big"><span id="temp">--</span>°C <span class="w" id="icon" aria-hidden="true">—</span></div>
        </div>

        <div id="hiLoOnly" class="hiLo hide forecast-highlight">最高 —°C / 最低 —°C</div>
      </div>
    </section>

    <section class="card" id="listCard" aria-labelledby="listTitle">
      <h2 id="listTitle">降水確率と気温</h2>
      <div id="graphContainer" class="graph-container hide" aria-label="気温推移グラフ"></div>
      <div id="list"></div>
      <div class="meta footer" id="listFooter">単位: % / °C / UV (Open-Meteo)</div>
    </section>

    <section class="card error-card hide" id="err" role="alert">
      <div id="errText"></div>
      <button id="btnRetry" type="button" class="retry-btn">再試行</button>
    </section>
  </main>

  <script src="weather-api.js"></script>
  <script src="weather-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
